services:
  knowledge_hub:
    image: pgvector/pgvector:pg18
    container_name: postgres-18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_knowledge_data:/var/lib/postgresql
  kafka:
      image: confluentinc/cp-kafka:8.1.3
      container_name: kafka
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.65.4:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      ports:
        - "9092:9092"

  redis:
        image: redis:latest
        container_name: redis
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        environment:
            - REDIS_ARGS=--requirepass password --appendonly yes
        restart: unless-stopped

volumes:
  redis-data:
    driver: local
  postgres_knowledge_data: