apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledgehub-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - davidchen.southeastasia.cloudapp.azure.com
      secretName: knowledgehub-tls
  rules:
    - host: davidchen.southeastasia.cloudapp.azure.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /image
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /share
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
