<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>KnowledgeHub Test</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0d0d0d; color: #e0e0e0; padding: 20px; }
  h2 { color: #7ec8e3; margin-bottom: 12px; }
  h3 { color: #a0c4a0; margin-bottom: 8px; }
  section { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  input, textarea, select { background: #111; border: 1px solid #444; color: #e0e0e0; padding: 6px 10px; border-radius: 4px; width: 100%; margin-bottom: 8px; font-family: monospace; }
  textarea { height: 100px; resize: vertical; }
  button { background: #2a4a2a; border: 1px solid #4a8a4a; color: #a0e0a0; padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-right: 6px; font-family: monospace; }
  button:hover { background: #3a6a3a; }
  button.danger { background: #4a2020; border-color: #8a4040; color: #e0a0a0; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  pre { background: #111; border: 1px solid #333; padding: 10px; border-radius: 4px; font-size: 12px; overflow: auto; max-height: 200px; white-space: pre-wrap; }
  .tag { display: inline-block; background: #1e3a1e; border: 1px solid #4a8a4a; color: #a0e0a0; padding: 2px 8px; border-radius: 4px; margin: 2px; cursor: pointer; font-size: 12px; }
  .tag.active { background: #2a6a2a; }
  #status { position: fixed; top: 10px; right: 10px; background: #1a2a1a; border: 1px solid #4a8a4a; padding: 8px 14px; border-radius: 4px; font-size: 12px; max-width: 300px; }
  .comment-item { border-left: 2px solid #444; padding: 6px 10px; margin-bottom: 6px; font-size: 13px; }
  .comment-item .meta { color: #888; font-size: 11px; }
  label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
</style>
</head>
<body>

<div id="status">未登入</div>

<!-- Config -->
<section>
  <h2>⚙ Config</h2>
  <div class="row">
    <div>
      <label>API Base URL</label>
      <input id="apiBase" value="http://localhost:5126">
    </div>
    <div>
      <label>Google Client ID</label>
      <input id="clientId" placeholder="xxx.apps.googleusercontent.com">
    </div>
  </div>
  <button onclick="initGoogle()">初始化 Google 登入</button>
  <div id="googleBtn" style="margin-top:8px"></div>
</section>

<!-- Auth -->
<section>
  <h2>🔑 Auth</h2>
  <label>JWT Token（登入後自動填入）</label>
  <input id="jwt" placeholder="eyJ...">
</section>

<!-- Notes -->
<section>
  <h2>📝 筆記</h2>
  <button onclick="listNotes()">載入筆記列表</button>
  <div id="noteList" style="margin: 8px 0"></div>
  <h3 style="margin-top:12px">新增 / 編輯筆記</h3>
  <input id="noteTitle" placeholder="標題">
  <textarea id="noteContent" placeholder="內容（支援 Markdown，[[noteId]] 語法）"></textarea>
  <div>
    <button onclick="addNote()">新增</button>
    <button onclick="updateNote()">更新選中筆記</button>
  </div>
  <div style="margin-top:8px">
    <label>選中筆記 ID</label>
    <input id="selectedNoteId" placeholder="點擊上方筆記選取" readonly style="background:#0d0d0d;cursor:default">
  </div>
</section>

<!-- Structure -->
<section>
  <h2>🤖 結構化</h2>
  <input id="structurePrompt" value="請將這篇筆記結構化，整理成清楚的重點">
  <button onclick="structureNote()">結構化選中筆記</button>
  <pre id="structureResult">-</pre>
</section>

<!-- Share -->
<section>
  <h2>🔗 分享</h2>
  <div class="row">
    <div>
      <label>Permission</label>
      <select id="sharePermission">
        <option value="read">read</option>
        <option value="readwrite">readwrite</option>
      </select>
    </div>
    <div style="display:flex;align-items:flex-end">
      <button onclick="createShare()" style="width:100%;margin-bottom:8px">建立分享連結</button>
    </div>
  </div>
  <pre id="shareResult">-</pre>
</section>

<!-- Comments -->
<section>
  <h2>💬 留言</h2>
  <button onclick="listComments()">載入留言</button>
  <div id="commentList" style="margin: 8px 0"></div>
  <h3 style="margin-top:12px">新增留言</h3>
  <textarea id="commentContent" placeholder="留言內容" style="height:60px"></textarea>
  <label>回覆的留言 ID（選填，點擊留言的「回覆」自動填入）</label>
  <input id="parentCommentId" placeholder="">
  <button onclick="addComment()">送出留言</button>
</section>

<!-- Log -->
<section>
  <h2>📋 Log</h2>
  <button class="danger" onclick="document.getElementById('log').textContent=''">清除</button>
  <pre id="log"></pre>
</section>

<script>
const api = () => document.getElementById('apiBase').value.replace(/\/$/, '');
const jwt = () => document.getElementById('jwt').value;
const noteId = () => document.getElementById('selectedNoteId').value;

function log(label, data) {
  const el = document.getElementById('log');
  el.textContent = `[${new Date().toLocaleTimeString()}] ${label}\n${JSON.stringify(data, null, 2)}\n\n` + el.textContent;
}

function setStatus(msg, ok = true) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.borderColor = ok ? '#4a8a4a' : '#8a4040';
}

async function req(method, path, body) {
  const res = await fetch(api() + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(jwt() ? { Authorization: `Bearer ${jwt()}` } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  log(`${method} ${path} → ${res.status}`, data);
  return { ok: res.ok, status: res.status, data };
}

// Google login
function initGoogle() {
  const clientId = document.getElementById('clientId').value;
  if (!clientId) { alert('請填 Google Client ID'); return; }
  google.accounts.id.initialize({
    client_id: clientId,
    callback: async ({ credential }) => {
      const r = await req('POST', '/oauth/google/token', { idToken: credential });
      if (r.ok && r.data.accessToken) {
        document.getElementById('jwt').value = r.data.accessToken;
        setStatus('已登入 ✓');
      } else {
        setStatus('登入失敗', false);
      }
    }
  });
  google.accounts.id.renderButton(document.getElementById('googleBtn'), { theme: 'outline', size: 'large' });
}

// Notes
async function listNotes() {
  const r = await req('GET', '/api/notes');
  if (!r.ok) return;
  const notes = r.data.notes ?? [];
  const el = document.getElementById('noteList');
  el.innerHTML = notes.length === 0
    ? '<span style="color:#888">無筆記</span>'
    : notes.map(n =>
        `<span class="tag" onclick="selectNote('${n.noteId}','${escHtml(n.title)}')">${escHtml(n.title)}</span>`
      ).join('');
}

function selectNote(id, title) {
  document.getElementById('selectedNoteId').value = id;
  setStatus(`選中：${title}`);
  document.querySelectorAll('#noteList .tag').forEach(t =>
    t.classList.toggle('active', t.textContent === title)
  );
}

async function addNote() {
  const title = document.getElementById('noteTitle').value;
  const content = document.getElementById('noteContent').value;
  if (!title) { alert('請填標題'); return; }
  const r = await req('POST', '/api/notes', { title, content });
  if (r.ok) {
    document.getElementById('selectedNoteId').value = r.data.noteId;
    setStatus(`選中：${title}`);
    listNotes();
  }
}

async function updateNote() {
  if (!noteId()) { alert('請先選取筆記'); return; }
  const title = document.getElementById('noteTitle').value;
  const content = document.getElementById('noteContent').value;
  await req('PUT', `/api/notes/${noteId()}`, { title, content });
}

// Structure
async function structureNote() {
  if (!noteId()) { alert('請先選取筆記'); return; }
  const prompt = document.getElementById('structurePrompt').value;
  const r = await req('POST', `/api/notes/${noteId()}/structure`, { prompt });
  document.getElementById('structureResult').textContent = r.ok
    ? `=== Description ===\n${r.data.description}\n\n=== Content ===\n${r.data.content}`
    : `Error: ${r.status}`;
}

// Share
async function createShare() {
  if (!noteId()) { alert('請先選取筆記'); return; }
  const permission = document.getElementById('sharePermission').value;
  const r = await req('POST', `/api/notes/${noteId()}/share`, { permission });
  document.getElementById('shareResult').textContent = r.ok
    ? `URL: ${r.data.url}\nPermission: ${r.data.permission}`
    : `Error: ${r.status}`;
}

// Comments
async function listComments() {
  if (!noteId()) { alert('請先選取筆記'); return; }
  const r = await req('GET', `/api/notes/${noteId()}/comments`);
  if (!r.ok) return;
  const comments = r.data.comments ?? [];
  const el = document.getElementById('commentList');
  el.innerHTML = comments.length === 0
    ? '<span style="color:#888">無留言</span>'
    : comments.map(c => `
        <div class="comment-item">
          <div class="meta">
            ${escHtml(c.username ?? 'unknown')} ·
            ${new Date(c.createdAt).toLocaleString()} ·
            <span style="cursor:pointer;color:#7ec8e3"
              onclick="document.getElementById('parentCommentId').value='${c.id}'">回覆</span>
          </div>
          <div>${escHtml(c.content)}</div>
        </div>`).join('');
}

async function addComment() {
  if (!noteId()) { alert('請先選取筆記'); return; }
  const content = document.getElementById('commentContent').value;
  if (!content) { alert('請填留言內容'); return; }
  const parentId = document.getElementById('parentCommentId').value || undefined;
  const r = await req('POST', `/api/notes/${noteId()}/comments`, { content, parentCommentId: parentId });
  if (r.ok) {
    document.getElementById('commentContent').value = '';
    document.getElementById('parentCommentId').value = '';
    listComments();
  }
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
