name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'src/Presentation/Web/**'
      - 'infra/configs/nginx.conf'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web image
        run: |
          docker build -f src/Presentation/Web/Dockerfile -t davidchen617/knowledgehub-web:${{ steps.meta.outputs.tag }} .
          docker push davidchen617/knowledgehub-web:${{ steps.meta.outputs.tag }}

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to k8s
        run: |
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          sed -i "s/IMAGE_TAG/$IMAGE_TAG/g" infra/k8s/web/deployment.yaml
          kubectl apply -f infra/k8s/web/deployment.yaml
          kubectl apply -f infra/k8s/web/service.yaml
          kubectl apply -f infra/k8s/web/ingress.yaml
          kubectl rollout status deployment/web --timeout=120s
