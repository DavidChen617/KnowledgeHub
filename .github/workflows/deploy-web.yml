name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'src/Presentation/Web/**'
      - 'infra/configs/nginx.conf'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Web image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -f src/Presentation/Web/Dockerfile -t davidchen617/knowledgehub-web:$SHORT_SHA .
          docker push davidchen617/knowledgehub-web:$SHORT_SHA

      - name: Deploy to k8s
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          sed -i "s/IMAGE_TAG/$SHORT_SHA/g" infra/k8s/web/deployment.yaml
          kubectl apply -f infra/k8s/web/deployment.yaml
          kubectl apply -f infra/k8s/web/service.yaml
          kubectl apply -f infra/k8s/web/ingress.yaml
          kubectl rollout status deployment/web --timeout=120s
