name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'src/Api/**'
      - 'src/Application/**'
      - 'src/Domain/**'
      - 'src/Infrastructure/**'
      - 'src/ShareKernal/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -f src/Api/Dockerfile -t davidchen617/knowledgehub-api:$SHORT_SHA .
          docker push davidchen617/knowledgehub-api:$SHORT_SHA

      - name: Apply secrets
        run: |
          echo "${{ secrets.K8S_ENV }}" > /tmp/.env
          set -a; source /tmp/.env; set +a
          envsubst < infra/k8s/postgres/secret.yaml | kubectl apply -f -
          envsubst < infra/k8s/api/secret.yaml | kubectl apply -f -
          rm /tmp/.env

      - name: Deploy to k8s
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          sed -i "s/IMAGE_TAG/$SHORT_SHA/g" infra/k8s/api/deployment.yaml
          kubectl apply -f infra/k8s/api/deployment.yaml
          kubectl apply -f infra/k8s/api/service.yaml
          kubectl rollout status deployment/api --timeout=120s
