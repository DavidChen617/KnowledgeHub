name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'src/Api/**'
      - 'src/Application/**'
      - 'src/Domain/**'
      - 'src/Infrastructure/**'
      - 'src/ShareKernal/**'
      - 'infra/k8s/api/**'
      - 'infra/k8s/postgres/**'
      - 'infra/k8s/redis/**'
      - 'infra/k8s/kafka/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -f src/Api/Dockerfile -t davidchen617/knowledgehub-api:${{ steps.meta.outputs.tag }} .
          docker push davidchen617/knowledgehub-api:${{ steps.meta.outputs.tag }}

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply secrets
        run: |
          echo "${{ secrets.K8S_ENV }}" > /tmp/.env
          set -a; source /tmp/.env; set +a
          envsubst < infra/k8s/postgres/secret.yaml | kubectl apply -f -
          envsubst < infra/k8s/api/secret.yaml | kubectl apply -f -
          rm /tmp/.env

      - name: Deploy to k8s
        run: |
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          sed -i "s/IMAGE_TAG/$IMAGE_TAG/g" infra/k8s/api/deployment.yaml
          kubectl apply -f infra/k8s/api/deployment.yaml
          kubectl apply -f infra/k8s/api/service.yaml
          kubectl rollout status deployment/api --timeout=120s
