name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'src/Api/**'
      - 'src/Application/**'
      - 'src/Domain/**'
      - 'src/Infrastructure/**'
      - 'src/ShareKernal/**'
      - 'infra/k8s/api/**'
      - 'infra/k8s/postgres/**'
      - 'infra/k8s/redis/**'
      - 'infra/k8s/kafka/**'
      - 'infra/configs/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -f src/Api/Dockerfile -t davidchen617/knowledgehub-api:${{ steps.meta.outputs.tag }} .
          docker push davidchen617/knowledgehub-api:${{ steps.meta.outputs.tag }}

      - name: Generate migration script
        run: |
          dotnet tool install -g dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            -p src/Infrastructure \
            -s src/Api \
            -o migration.sql

      - name: Upload k8s manifests
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: infra/

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migration-sql
          path: migration.sql

  migrate:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Download migration script
        uses: actions/download-artifact@v4
        with:
          name: migration-sql

      - name: Apply migrations
        run: |
          POSTGRES_USER=$(kubectl get secret postgres-secret -o jsonpath='{.data.POSTGRES_USER}' | base64 -d)
          POSTGRES_DB=$(kubectl get secret postgres-secret -o jsonpath='{.data.POSTGRES_DB}' | base64 -d)
          POSTGRES_POD=$(kubectl get pods -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          kubectl cp migration.sql default/$POSTGRES_POD:/tmp/migration.sql
          kubectl exec $POSTGRES_POD -- psql -U $POSTGRES_USER -d $POSTGRES_DB -f /tmp/migration.sql
          kubectl exec $POSTGRES_POD -- rm /tmp/migration.sql

  deploy:
    runs-on: self-hosted
    needs: [build, migrate]

    steps:
      - name: Download k8s manifests
        uses: actions/download-artifact@v4
        with:
          name: k8s-manifests
          path: infra/

      - name: Apply ConfigMaps
        run: |
          kubectl create configmap redis-config \
            --from-file=redis.conf=infra/configs/redis.conf \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply secrets
        env:
          K8S_ENV: ${{ secrets.K8S_ENV }}
        run: |
          echo "$K8S_ENV" > /tmp/.env
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line//[[:space:]]/}" ]] && continue
            [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] || continue
            key="${line%%=*}"
            value="${line#*=}"
            value="${value#\"}" value="${value%\"}"
            export "$key=$value"
          done < /tmp/.env
          envsubst < infra/k8s/postgres/secret.yaml | kubectl apply -f -
          envsubst < infra/k8s/api/secret.yaml | kubectl apply -f -
          rm /tmp/.env

      - name: Deploy to k8s
        run: |
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          sed -i "s/IMAGE_TAG/$IMAGE_TAG/g" infra/k8s/api/deployment.yaml
          kubectl apply -f infra/k8s/api/deployment.yaml
          kubectl apply -f infra/k8s/api/service.yaml
          kubectl rollout status deployment/api --timeout=120s
